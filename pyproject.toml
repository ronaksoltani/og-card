[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "og-card-studio"
version = "1.0.0"
description = "Render social preview cards locally with Pillow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["Pillow>=10.0"]

[project.scripts]
og-card = "og_card.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
